[workspace]
resolver = "2"
members = ["crates/fileem-core", "crates/fileem"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[profile.release]
# One small native executable: link-time optimisation, stripped symbols.
lto = true
codegen-units = 1
# unwinding, so a decoder that panics on a damaged file costs one thumbnail, not the app
panic = "unwind"
strip = true
