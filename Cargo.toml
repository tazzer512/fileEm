[workspace]
resolver = "2"
members = ["crates/fileem-core", "crates/fileem"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
# One small native executable: link-time optimisation, no unwinding tables, stripped symbols.
lto = true
codegen-units = 1
panic = "abort"
strip = true
