[package]
name = "fileem"
description = "fileEm: an Explorer-style file manager with an optional Commander-style second side"
version.workspace = true
edition.workspace = true

[[bin]]
name = "fileem"
path = "src/main.rs"

[dependencies]
fileem-core = { path = "../fileem-core" }
# No Qt backend: winit (Wayland, X11, Windows, macOS) with the OpenGL renderer, and the software
# renderer as a fallback where OpenGL is missing.
slint = { version = "1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
] }

clipboard-rs = { version = "0.3", default-features = false }

[target.'cfg(unix)'.dependencies]
# sigwait for saving on SIGTERM / logout (src/signals.rs)
libc = "0.2"

# the .exe's icon and version info (build.rs; needs rc.exe / windres, which Windows toolchains have)
[target."cfg(windows)".build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[build-dependencies]
slint-build = "1"

# its own process with no test harness: it sends itself signals
[[test]]
name = "signals"
harness = false

[dev-dependencies]
tempfile = "3"
# test images, and fileem-core's test files (camera raws, Photoshop documents)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
fileem-core = { path = "../fileem-core", features = ["fixtures"] }
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }
# where the open menu popups sit (the testing backend reports positions inside a popup); same pin
i-slint-core = "=1.18.1"
